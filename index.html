<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #222;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ddd;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>JavaScript Demo</h1>
  <p>Click the button to run a small JavaScript function.</p>
  <button id="runButton">Run JS</button>
  <div id="output">Result will appear here.</div>

  <script>
    const button = document.getElementById('runButton');
    const output = document.getElementById('output');

    function getGreeting() {
      const now = new Date();
      return `Hello! Today is ${now.toLocaleDateString()} and the time is ${now.toLocaleTimeString()}.`;
    }

    button.addEventListener('click', () => {
      output.textContent = getGreeting();
    });
  </script>
</body>
</html>
